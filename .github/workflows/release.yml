name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  pre:
    runs-on: windows-latest
    outputs:
      # Assume pushes to tags are always full releases
      is_full_release: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || github.event_name == 'workflow_dispatch' }}
    steps:
      - run: "true"
  release:
    name: Release
    needs: pre
    runs-on: windows-latest
    environment: publishing
    permissions:
      contents: write
    steps:
      - name: Checkout
        # v7
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup CMake
        # v4.4.2
        uses: lukka/get-cmake@fffaaafeea488556c2c12dad60690008bc1caacb
      - name: Build
        shell: pwsh
        # Modified from https://github.com/tetsuh/sitos/blob/59d84bf7ebf29f0d424d484ef38ebb9204dbf9a7/.github/workflows/ci.yml
        # For some reason, the CI uses MinGW by default instead of MSVC, so we get inflated binary for no reason.
        run: |
          $VsWhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $VsInstallPath = & $VsWhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $DevShellPath = Join-Path $VsInstallPath "Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          Import-Module $DevShellPath -Scope Local
          Enter-VsDevShell -Arch amd64 -HostArch amd64 -VsInstallPath $VsInstallPath -SkipAutomaticLocation
          cmake --preset release
          cmake --build --preset release
      - name: Generate Changelog
        if: needs.pre.outputs.is_full_release == 'true'
        id: cliff
        # v4
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff
        with:
          config: ".cliff.toml"
          args: --latest -v
        env:
          GITHUB_REPO: ${{ github.repository }}
      - name: Create GitHub Release
        if: needs.pre.outputs.is_full_release == 'true'
        # v3
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
        with:
          fail_on_unmatched_files: true
          files: |
            build/release/native-*.dll
          body: ${{ steps.cliff.outputs.content }}
