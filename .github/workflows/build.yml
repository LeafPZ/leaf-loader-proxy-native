name: Build

on:
  push:
    # ignoring tags also ignores branches
    tags-ignore:
      - '**'
    branches:
      - '**'
  pull_request:
    branches:
      - 'main'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-changes:
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      build: ${{ steps.filter.outputs.build }}
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Checkout
        # v7
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        # v4
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d
        id: filter
        with:
          filters: |
            build:
              - 'CMakeLists.txt'
              - 'CMakePresets.json'
            code:
              - 'src/**'
  build:
    name: Build
    runs-on: windows-latest
    needs: check-changes
    if: ${{ needs.check-changes.outputs.build == 'true' || needs.check-changes.outputs.code == 'true' }}
    steps:
      - name: Checkout
        # v7
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup CMake
        # v4.4.2
        uses: lukka/get-cmake@fffaaafeea488556c2c12dad60690008bc1caacb
      - name: Build
        shell: pwsh
        # Taken from https://github.com/tetsuh/sitos/blob/59d84bf7ebf29f0d424d484ef38ebb9204dbf9a7/.github/workflows/ci.yml
        # For some reason, the CI uses MinGW by default instead of MSVC, so we get inflated binary for no reason.
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          cmd /c "call `"$vsPath\VC\Auxiliary\Build\vcvars64.bat`" && cmake --preset release && cmake --build --preset release"
